#!/usr/sbin/nft -f
# Installed as /etc/nftables.conf by install.sh. @MIRROR@ and @UPLINK@ are filled in there.
#
# The Pi only makes outgoing HTTPS calls. Nothing may reach it, except SSH over the
# uplink, and it never sends anything on the mirror port. Packet capture is not
# affected: it reads frames before netfilter sees them.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        iifname "@UPLINK@" udp sport 67 udp dport 68 accept
        iifname "@UPLINK@" udp sport 547 udp dport 546 accept
        iifname "@UPLINK@" tcp dport 22 ct state new limit rate 10/minute accept
        iifname "@UPLINK@" icmp type echo-request limit rate 5/second accept
        iifname "@UPLINK@" icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
        oifname "@MIRROR@" drop
    }
}
