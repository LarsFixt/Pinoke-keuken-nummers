#!/usr/sbin/nft -f
# Installed as /etc/nftables.conf by install.sh.
# The kiosk only makes outgoing connections. Nothing may reach it except SSH.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept
        tcp dport 22 ct state new limit rate 10/minute accept
        icmp type echo-request limit rate 5/second accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}
